allowBuilds:
  '@clerk/shared': false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - '@clerk/shared'
  - msw
  - sharp
  - unrs-resolver
# SCA: pin transitive deps past their HIGH advisories (pnpm audit).
# postcss/nanoid ride with Next's bundled copies; the rest are dev
# toolchain (eslint/shadcn/vitest). sharp native builds are disabled
# above, but the version is still pinned past its libvips CVEs.
overrides:
  postcss: 8.5.18
  nanoid: 3.3.18
  fast-uri: 3.1.6
  brace-expansion: 1.1.18
  js-yaml: 4.3.1
  ip-address: 10.3.1
  browserslist: 4.28.7
  undici: 7.29.0
  sharp: 0.35.0
