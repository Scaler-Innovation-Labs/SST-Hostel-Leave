name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Add other required env vars here

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./my-app

      - name: Typecheck
        run: pnpm typecheck
        working-directory: ./my-app

      - name: Lint
        run: pnpm lint
        working-directory: ./my-app

      - name: Architecture audit
        run: pnpm audit:architecture
        working-directory: ./my-app

      - name: Test
        run: pnpm test
        working-directory: ./my-app

      - name: Build
        run: pnpm build
        working-directory: ./my-app